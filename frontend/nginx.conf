server {
    listen 80;
    server_name localhost;

    # nginx's compiled-in default (1MB) rejects document/face photo uploads
    # from real cameras with a 413 before they ever reach the backend, which
    # has no size limit of its own. Document uploads get normalized to
    # 1600px width server-side, but that's after this check -- raise the
    # proxy's own ceiling well above a typical phone photo.
    client_max_body_size 20M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
